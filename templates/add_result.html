<!DOCTYPE html>
<html>

<head>

<title>Add Student Result</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, Arial;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(270deg,#667eea,#764ba2,#6dd5ed,#2193b0);
background-size:800% 800%;
animation:bgMove 15s ease infinite;

}

@keyframes bgMove{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}

.container{

width:420px;
padding:35px;

background:rgba(255,255,255,0.15);
border-radius:20px;

backdrop-filter:blur(10px);

box-shadow:0 25px 45px rgba(0,0,0,0.3);

text-align:center;
color:white;

}

h2{

margin-bottom:25px;
font-size:28px;

}

input{

width:90%;
padding:12px;

margin:10px 0;

border:none;
border-radius:8px;

outline:none;

}

button{

width:200px;
padding:12px;

margin-top:15px;

border:none;
border-radius:25px;

background:linear-gradient(45deg,#00c6ff,#0072ff);

color:white;
font-size:16px;
font-weight:600;

cursor:pointer;

transition:0.3s;

}

button:hover{

transform:scale(1.05);

background:linear-gradient(45deg,#ff6a00,#ee0979);

box-shadow:0 10px 20px rgba(0,0,0,0.3);

}

.back{

margin-top:15px;

}

</style>

</head>

<body>

<div class="container">

<h2>Add Student Result</h2>

<form method="POST">

<input type="text" name="name" placeholder="Student Name" required>

<input type="text" name="roll" placeholder="Roll Number" required>

<input type="number" name="m1" placeholder="Subject 1 Marks" required>

<input type="number" name="m2" placeholder="Subject 2 Marks" required>

<input type="number" name="m3" placeholder="Subject 3 Marks" required>

<br>

<button type="submit">Submit Result</button>

</form>

<div class="back">

<a href="/">
<button>Back to Home</button>
</a>

</div>

</div>

</body>

</html>
